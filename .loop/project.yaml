    # `Conteúdo/taxonomia` entrou em 2026-08-07, por run proprio e anterior,
    # como manda o comentario de `conteúdo/extrações` logo abaixo. A lista
    # tinha deste diretorio so a grafia do INDICE DO GIT — minuscula e em NFC
    # — enquanto os tres irmaos acima ja estavam na grafia do DISCO, que e
    # maiuscula e em NFD. Sao dois eixos de diferenca, nao um.
    #
    # O efeito era uma transacao impossivel de abrir certo: `pathIsWritable`
    # (Loop, src/project.ts) compara byte a byte, entao declarar o caminho
    # como o disco o soletra reprovava com INVALID_SCOPE no `step begin`; e
    # declarar como o git o soletra, que passa no begin, e exatamente o que
    # devolveu OUT_OF_SCOPE_CHANGE no `step finish` e custou um run em
    # 2026-08-07 — o guarda do fim compara contra o disco. As duas grafias
    # ficam: o indice ainda carrega a minuscula, e um checkout pode
    # materializa-la.
    - Conteúdo/taxonomia
    # JANELA TEMPORARIA, aberta em 2026-08-08 para regerar a fonte do piloto
    # `fundamentos-de-radiologia-everton-costa-pinto`. O extrator foi corrigido
    # em 2026-08-07 e a extracao dela nunca foi refeita, entao os quatro
    # fragmentos abaixo de 80 caracteres seguem no disco. Reextrair leva 109
    # excertos a 105 e zera os fragmentos, mas muda as fronteiras — o que
    # invalida classifications.json, chaveado por sourceExcerptId. As duas
    # raizes entram JUNTAS porque a operacao e uma so.
    #
    # Por que `extracoes` entra mesmo com excerpts.json e pages.json nao
    # rastreados: `extraction-job.json` E rastreado e guarda excerptCount, e
    # validate-foundation.mjs:348 compara esse numero com o tamanho real do
    # arquivo. Deixa-lo em 109 com 105 no disco REPROVA O GATE para todas as
    # IAs do projeto.
    #
    # Grafia derivada de readdir, nunca digitada: o disco e MISTO por
    # componente — `Conteudo` em NFD, `extracoes` e `classificacao` em NFC.
    # Digitar produz tudo NFC e nao casa.
    #
    # As duas saem quando a regeracao fechar, pela mesma porta do alargamento
    # anterior: run proprio e motivo escrito.
    - Conteúdo/extrações
    - Conteúdo/classificação
    # `conteúdo/extrações` esteve aqui em 2026-08-07, por uma janela de dois
    # commits (a5d9cc8 e adee209) e um proposito unico: retirar do indice do git
    # o texto de fonte `blocked` que estava rastreado desde 847a12d. Cumprido o
    # proposito, a entrada saiu. Artefato de extracao e subproduto local — se
    # precisar entrar de novo, entra pela mesma porta: run proprio, anterior, e
    # com o motivo escrito.
    - .loop/project.yaml
validators:
  - id: docs-contract
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      --test scripts/qa/docs-contract.test.mjs && PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      node scripts/qa/docs-contract.mjs
    timeoutMs: 120000
  - id: content-foundation
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      scripts/content/validate-foundation.mjs
    timeoutMs: 120000
  - id: content-wave1
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      --test scripts/content/wave-1-priority-tracks.test.mjs
    timeoutMs: 120000
  - id: content-anchoring
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      --test scripts/content/validate-content-anchoring.test.mjs scripts/content/validate-taxonomy-map.test.mjs
    timeoutMs: 120000
  - id: content-anchoring-data
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      scripts/content/validate-content-anchoring.mjs
    timeoutMs: 120000
  - id: content-no-verbatim
    command: PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin node
      --test scripts/content/validate-no-verbatim.test.mjs && PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      node scripts/content/validate-no-verbatim.mjs
    timeoutMs: 120000
  - id: content-python
    command: PATH=/usr/bin:/bin sh -c 'estado=0; for suite in scripts/content/build-manifest.test.py
      scripts/content/extract-source.test.py
      scripts/content/embed-excerpts.test.py scripts/content/anchor-lesson.test.py
      scripts/content/calibration-report.test.py scripts/content/destination-state.test.py
      scripts/content/sampling-queue.test.py; do python3 "$suite" || estado=1; done;
      exit $estado'
    timeoutMs: 120000
  - id: app-quality
    command: cd radiant-app &&
      PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      EXPO_NO_DOTENV=1 CI=1 npm_config_update_notifier=false npm run quality
    timeoutMs: 180000
  - id: app-test
    command: cd radiant-app &&
      PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      EXPO_NO_DOTENV=1 CI=1 npm_config_update_notifier=false npm test --
      --runInBand --no-cache
    timeoutMs: 180000
  - id: api-lint
    command: cd radiant-api &&
      PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      DOTENV_CONFIG_PATH=/dev/null npm run lint
    timeoutMs: 120000
  - id: api-typecheck
    command: cd radiant-api &&
      PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      DOTENV_CONFIG_PATH=/dev/null npm run typecheck
    timeoutMs: 120000
  - id: api-test
    command: cd radiant-api &&
      PATH=/Users/anderson/.nvm/versions/node/v20.20.2/bin:/usr/bin:/bin
      DOTENV_CONFIG_PATH=/dev/null NODE_ENV=test CI=1 npm test
    timeoutMs: 120000
  - id: brain-links
    command: PATH=/Users/anderson/.local/bin:/usr/bin:/bin loop brain validate-links
    timeoutMs: 120000
limits:
