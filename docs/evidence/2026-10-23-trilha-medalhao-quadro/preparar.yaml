appId: com.ascendcreative.radiant
name: Android momento com leitura anterior real da trilha
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: 'http://10.0.2.2:8081'
    timeout: 30000
- tapOn: 'http://10.0.2.2:8081'
- extendedWaitUntil:
    visible: 'This is the developer menu\. .*|^Tela 1 de 3\. Oi, eu sou o Pixel\..*$'
    timeout: 60000
- runFlow:
    when:
      visible: 'This is the developer menu\. .*'
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: '(?i:connected to:?)'
    commands:
      - pressKey: back
- assertVisible: '^Tela 1 de 3\. Oi, eu sou o Pixel\..*$'
- tapOn: 'Continuar'
- assertVisible: '^Tela 2 de 3\. Trilha, quiz e revisão\..*$'
- tapOn: 'Continuar'
- assertVisible: '^Tela 3 de 3\. Funciona offline, sem conta\..*$'
- tapOn: 'Começar'
- tapOn: Fechar quiz
- assertVisible:
    id: journey-trail
- tapOn:
    id: journey-recommendation-action
- assertVisible: 'Você vai começar pelo papel dos raios-X e pelo raciocínio básico de contraste e radiopacidade.'
- assertVisible: 'Passo 1 de 5'
- assertVisible: '5 de 5 vidas'
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
# A conclusão é um estado da tela da lição desde a 1.4; antes, o último passo
# devolvia o aluno à aba em silêncio.
- assertVisible: A lição foi concluída
- assertVisible: 'Respostas corretas: 3 de 3 corretas'
- scrollUntilVisible:
    element: '^Próxima revisão em \d+ (dia|dias)$'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
# O número de dias NÃO é afirmado. Medido em 2026-09-24 (1 de 3 execuções):
# o texto disse "2 dias" para uma revisão que vence em exatas 24 h, porque o
# cartão do SM-2 carimba o próprio relógio 1 ms depois do `answeredAt`, e
# `Math.ceil` transforma esse milissegundo num dia (`LessonFlowScreen`).
# Defeito do app, registrado na FILA. O agendamento real (+24 h) é o que o
# caminho 2 mede.
- assertVisible: '^Próxima revisão em \d+ (dia|dias)$'
