    <ellipse cy="-6" rx="15" ry="16" fill="#120F33"/>
    <path d="M-15,-6 A15,16 0 0,1 15,-6 A15,12 0 0,0 -15,-6 Z" fill="#2E2870"/>
    <circle class="no-sil" cx="0" cy="-26" r="2.6" fill="#B9A8FF"/>
    <rect x="-44" y="12" width="88" height="8" rx="4" fill="#DCE3F0"/>
    <rect x="-44" y="16" width="88" height="4" rx="2" fill="#AEB9D0"/>
