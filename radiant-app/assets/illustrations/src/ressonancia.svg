  <g transform="translate(60 60) scale(1.4)">
    <rect x="-34" y="-30" width="68" height="58" rx="10" fill="#B9C4DC"/>
    <rect x="-34" y="-34" width="68" height="58" rx="10" fill="#F4F6FB"/>
    <rect x="-34" y="-34" width="11" height="58" rx="5" fill="#7C5CFF"/>
