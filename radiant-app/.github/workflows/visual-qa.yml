name: Visual QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  visual-qa:
    name: 👁 Visual Guardrails
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Or use strict from .nvmrc if applicable
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Visual QA
        run: npm run visual:qa

      - name: Type Check
        run: npx tsc --noEmit
