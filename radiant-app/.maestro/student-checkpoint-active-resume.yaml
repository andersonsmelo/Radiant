appId: com.ascendcreative.radiant
name: Active internal checkpoint offers explicit offline resume
tags:
  - checkpoint
  - active-internal
  - offline
---
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: 'Tela 1 de 3\..*'
- tapOn: Continuar
- assertVisible: 'Tela 2 de 3\..*'
- setAirplaneMode: enabled
- killApp
- launchApp:
    arguments:
      radiantReduceMotion: '1'
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: 'Continuar de onde você parou\?'
- assertNotVisible: 'Tela 2 de 3\..*'
- tapOn: Retomar estudo
- assertVisible: 'Tela 2 de 3\..*'
- tapOn: Pular apresentação
# Cabeçalho acessível da Estude, incluindo título e progresso agrupados.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
- setAirplaneMode: disabled
- assertVisible: Continuar jornada
- tapOn: Continuar jornada
- assertVisible: Fundamentos de Radiologia
