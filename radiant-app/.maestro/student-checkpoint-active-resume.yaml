appId: com.ascendcreative.radiant
name: Active internal checkpoint offers explicit offline resume
tags:
  - checkpoint
  - active-internal
  - offline
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in your development builds.'
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: 'Connected to:'
    commands:
      - tapOn: Close
- assertVisible: 'Tela 1 de 3\..*'
- tapOn: Continuar
- assertVisible: 'Tela 2 de 3\..*'
- setAirplaneMode: enabled
- killApp
- launchApp
- assertVisible: 'Continuar de onde você parou\?'
- assertNotVisible: 'Tela 2 de 3\..*'
- tapOn: Retomar estudo
- assertVisible: 'Tela 2 de 3\..*'
- tapOn: Pular apresentação
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
- assertVisible: '^\d+ de \d+$'
- setAirplaneMode: disabled
- repeat:
    times: 15
    while:
      notVisible: Continuar jornada
    commands:
      - scroll
- scroll
- tapOn: Continuar jornada
- assertVisible: Fundamentos de Radiologia
