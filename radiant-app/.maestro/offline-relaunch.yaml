appId: com.ascendcreative.radiant
name: Local progress persists after an offline relaunch
tags:
  - offline
  - local-first
---
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
# O dev client entra por espera explícita, e não por `runFlow when`, que é
# avaliado uma vez só e perde a folha que sobe depois (medido em 2026-09-24 e
# de novo em 2026-09-28; ver o subflow).
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml
- openLink:
    link: radiantapp://learn?nodeId=node%3Alesson-1&blockId=block%3Alesson-1%3Aintro
- runFlow:
    when:
      visible: 'Abrir com “Radiant”\?'
    commands:
      - tapOn: Abrir
- assertVisible: Fundamentos de Radiologia
- tapOn: Continuar
# As duas asserções abaixo não são redundantes com o tap anterior: no Maestro,
# `assertVisible` é a espera. Sem elas, dois `tapOn: Continuar` seguidos emendam
# direto no `scrollUntilVisible`, que começa a rolar antes de o passo do quiz
# existir na árvore e estoura o timeout de 20s. No iOS isso nunca aparecia
# porque a tela renderiza em ~0,1s; no Android, ~5x mais lento, o flow falhou
# 2 de 2 (2026-08-03) enquanto o irmão learning-critical-path, que já tinha
# estas esperas, passou no mesmo emulador e na mesma execução.
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
# O resumo da lição (`LessonSummary`), que entrou na 1.4, fica entre a lição
# e a trilha. Este flow é anterior a ele e seguia direto para a trilha;
# medido em 2026-09-28, no simulador, parava aqui.
- assertVisible: A lição foi concluída
- tapOn: Continuar
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# Desde os consertos de acessibilidade da 1.4, o contador é lido junto com o
# título no rótulo do cabeçalho ("<trilha>. N de M etapas concluídas."), e o
# texto solto "N de M" não aparece mais na árvore. Medido em 2026-09-28.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# setAirplaneMode takes enabled/disabled, not a boolean — `true` fails to parse.
- setAirplaneMode: enabled
- killApp
- launchApp:
    arguments:
      radiantReduceMotion: '1'
# Num build com dev client, a reabertura para no launcher ("DEVELOPMENT
# SERVERS"), esperando a escolha do servidor (medido em 2026-09-28). O subflow
# cobre esse estado; num build de loja ele não aparece.
- runFlow: subflows/dismiss-dev-client.yaml
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# A recomendação fica no header rolável; a rota continua vindo do próximo nó.
- scrollUntilVisible:
    element:
      id: journey-recommendation-action
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
# Volta do centramento (2026-10-18). O `centerElement` do Maestro 2.7 dá UM
# deslize fixo (~505 pt num iPhone 17 Pro) quando o centro do botão está a
# mais de 1/5 da altura do centro da tela, e aceita onde ele parar. Com o
# centro entre ~611 e ~690 pt, o botão para sob o HUD, ainda "visível" na
# árvore, e o toque cai no HUD (medido no `reward-unlock`, 3ª lição). A volta
# para cima não faz nada se o botão já está na faixa central e o devolve à
# posição anterior, livre do HUD e da barra de abas, se passou.
- assertVisible:
    id: journey-recommendation-action
- scrollUntilVisible:
    element:
      id: journey-recommendation-action
    direction: UP
    centerElement: true
    visibilityPercentage: 100
- assertVisible: Continuar trilha
- setAirplaneMode: disabled
