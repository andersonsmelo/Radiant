- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am21%3Aaula-01&nodeId=node%3Aactivity%3Artg-2026%3Am21%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
