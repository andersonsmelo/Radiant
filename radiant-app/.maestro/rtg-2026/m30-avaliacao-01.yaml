- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 8 de 8'
- tapOn: 'Concluir e voltar'
- assertVisible: 'A lição foi concluída'
- openLink: 'radiantapp://checkpoint?nodeId=node%3Acheckpoint%3Artg-2026%3Am30%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Começar avaliação'
    timeout: 15000
- tapOn: 'Começar avaliação'
# item 1
- scrollUntilVisible:
    element:
      text: 'Sob a mesa, com o detector no braço acima'
- tapOn: 'Sob a mesa, com o detector no braço acima'
- scrollUntilVisible:
