      text: 'Ponto 3, as duas linhas finas de cores diferentes, subindo retas, sem rótulo'
    direction: UP
- tapOn: 'Ponto 3, as duas linhas finas de cores diferentes, subindo retas, sem rótulo'
- scrollUntilVisible:
