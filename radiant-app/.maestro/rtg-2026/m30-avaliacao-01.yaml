      id: 'label-chip-Feixe'
- tapOn:
    id: 'label-chip-Feixe'
- scrollUntilVisible:
    element:
      text: 'Ponto 4, a figura deitada de costas, na altura do peito, sem rótulo'
    direction: UP
- tapOn: 'Ponto 4, a figura deitada de costas, na altura do peito, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Paciente'
- tapOn:
    id: 'label-chip-Paciente'
- scrollUntilVisible:
    element:
      text: 'Ponto 5, a faixa onde o corpo se apoia, na ponta direita do desenho, sem rótulo'
    direction: UP
- tapOn: 'Ponto 5, a faixa onde o corpo se apoia, na ponta direita do desenho, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Mesa'
- tapOn:
