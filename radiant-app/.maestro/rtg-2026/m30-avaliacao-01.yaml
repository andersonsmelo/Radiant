appId: com.ascendcreative.radiant
name: 'RTG M30: avaliação 1 (aula 01)'
tags:
  - rtg-2026
  - generated
---
# Gerado por scripts/qa/generate-rtg-maestro.mjs a partir da aula-fonte. Não edite à mão.
# BLOQUEADA EM INSTALAÇÃO LIMPA: a tela de avaliação mostra "Bloqueada" até a aula 01 estar concluída
# (unlockRule do nó), e o app não é alterado para contornar isso. Por isso o flow joga a aula 01 antes e só então abre a rota /checkpoint.
# Sem repetir launchApp: reaberto com clearState, o progresso se perderia. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am30%3Aaula-01&nodeId=node%3Aactivity%3Artg-2026%3Am30%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m30:aula-01:i1:c'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m30:aula-01:i1:c'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
# interaction i2 label
- scrollUntilVisible:
    element:
      text: 'Ponto 1, embaixo, o bloco azul sob o tampo, no meio do desenho, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, embaixo, o bloco azul sob o tampo, no meio do desenho, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Fonte de raios X'
- tapOn:
    id: 'label-chip-Fonte de raios X'
- scrollUntilVisible:
    element:
      text: 'Ponto 2, no alto, o bloco azul que fica acima do corpo, sem rótulo'
    direction: UP
- tapOn: 'Ponto 2, no alto, o bloco azul que fica acima do corpo, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Braço do detector'
- tapOn:
    id: 'label-chip-Braço do detector'
- scrollUntilVisible:
