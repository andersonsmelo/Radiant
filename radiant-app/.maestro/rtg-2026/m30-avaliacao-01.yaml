      text: 'Osso e tecido mole os absorvem de modos diferentes'
- tapOn: 'Osso e tecido mole os absorvem de modos diferentes'
- scrollUntilVisible:
    element:
      text: 'Enviar avaliação'
- tapOn: 'Enviar avaliação'
- extendedWaitUntil:
