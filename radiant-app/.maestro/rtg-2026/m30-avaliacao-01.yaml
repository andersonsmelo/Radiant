      id: 'conversation-option-Separam osso de tecido mole\. E a dose é baixa em comparação com outros raios X\.'
- tapOn:
    id: 'conversation-option-Separam osso de tecido mole\. E a dose é baixa em comparação com outros raios X\.'
- scrollUntilVisible:
