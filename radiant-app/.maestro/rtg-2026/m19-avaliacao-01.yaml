    direction: UP
- tapOn: 'Ponto 5, embaixo, o par de bobinas pequeno, de poucas voltas, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Transformador do filamento'
- tapOn:
    id: 'label-chip-Transformador do filamento'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 6 de 8'
# interaction i4 matching
- scrollUntilVisible:
    element:
      text: 'Associar Rede elétrica a Fornece a tensão alternada de partida'
- tapOn: 'Associar Rede elétrica a Fornece a tensão alternada de partida'
- scrollUntilVisible:
