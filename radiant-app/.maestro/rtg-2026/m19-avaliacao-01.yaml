      text: 'Associar Retificador a Mantém a corrente num só sentido'
- tapOn: 'Associar Retificador a Mantém a corrente num só sentido'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 7 de 8'
# interaction i5 true-false
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- assertVisible: 'Afirmação 2 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 3 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- assertVisible: 'Afirmação 4 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 8 de 8'
- tapOn: 'Concluir e voltar'
- assertVisible: 'A lição foi concluída'
- openLink: 'radiantapp://checkpoint?nodeId=node%3Acheckpoint%3Artg-2026%3Am19%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Começar avaliação'
    timeout: 15000
- tapOn: 'Começar avaliação'
# item 1
- scrollUntilVisible:
    element:
      text: 'O retificador, a ponte de diodos'
- tapOn: 'O retificador, a ponte de diodos'
- scrollUntilVisible:
    element:
      text: 'Próxima questão'
- tapOn: 'Próxima questão'
# item 2
- scrollUntilVisible:
    element:
      text: 'O transformador menor, o do filamento'
- tapOn: 'O transformador menor, o do filamento'
- scrollUntilVisible:
    element:
      text: 'Enviar avaliação'
- tapOn: 'Enviar avaliação'
- extendedWaitUntil:
    visible: 'Avaliação concluída'
    timeout: 15000
