appId: com.ascendcreative.radiant
name: 'RTG M19: avaliação 1 (aula 01)'
tags:
  - rtg-2026
  - generated
---
# Gerado por scripts/qa/generate-rtg-maestro.mjs a partir da aula-fonte. Não edite à mão.
# BLOQUEADA EM INSTALAÇÃO LIMPA: a tela de avaliação mostra "Bloqueada" até a aula 01 estar concluída
# (unlockRule do nó), e o app não é alterado para contornar isso. Por isso o flow joga a aula 01 antes e só então abre a rota /checkpoint.
# Sem repetir launchApp: reaberto com clearState, o progresso se perderia. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am19%3Aaula-01&nodeId=node%3Aactivity%3Artg-2026%3Am19%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m19:aula-01:i1:b'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m19:aula-01:i1:b'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
# interaction i2 ordering
- scrollUntilVisible:
    element:
      text: 'Subir O retificador deixa a corrente num só sentido'
- tapOn: 'Subir O retificador deixa a corrente num só sentido'
- scrollUntilVisible:
    element:
      text: 'Selecionar esta ordem'
- tapOn: 'Selecionar esta ordem'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
# interaction i3 label
- scrollUntilVisible:
    element:
      text: 'Ponto 1, à esquerda, o círculo com uma onda desenhada, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, à esquerda, o círculo com uma onda desenhada, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Rede elétrica'
- tapOn:
    id: 'label-chip-Rede elétrica'
- scrollUntilVisible:
    element:
      text: 'Ponto 2, no alto, duas bobinas, a da direita com mais voltas, sem rótulo'
    direction: UP
- tapOn: 'Ponto 2, no alto, duas bobinas, a da direita com mais voltas, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Transformador de alta tensão'
- tapOn:
    id: 'label-chip-Transformador de alta tensão'
- scrollUntilVisible:
    element:
      text: 'Ponto 3, no centro do alto, o losango com quatro setas, sem rótulo'
    direction: UP
- tapOn: 'Ponto 3, no centro do alto, o losango com quatro setas, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Retificador'
- tapOn:
    id: 'label-chip-Retificador'
- scrollUntilVisible:
    element:
      text: 'Ponto 4, à direita, a cápsula com um traço em onda e uma placa, sem rótulo'
    direction: UP
- tapOn: 'Ponto 4, à direita, a cápsula com um traço em onda e uma placa, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Tubo de raios X'
- tapOn:
    id: 'label-chip-Tubo de raios X'
- scrollUntilVisible:
