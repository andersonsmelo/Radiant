- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 7 de 8'
# interaction i5 true-false
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 2 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- assertVisible: 'Afirmação 3 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 4 de 4'
- scrollUntilVisible:
