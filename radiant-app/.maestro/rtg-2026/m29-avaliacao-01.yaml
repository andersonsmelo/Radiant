      text: 'Ponto 1, à esquerda, a curva que sobe depressa até o topo, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, à esquerda, a curva que sobe depressa até o topo, sem rótulo'
- scrollUntilVisible:
    element:
