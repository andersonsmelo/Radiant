      text: 'Ponto 5, à direita, a curva que cai devagar e termina mais alta, sem rótulo'
    direction: UP
- tapOn: 'Ponto 5, à direita, a curva que cai devagar e termina mais alta, sem rótulo'
- scrollUntilVisible:
