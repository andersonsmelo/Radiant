      text: 'Ponto 4, à direita, a curva que cai depressa até perto de zero, sem rótulo'
    direction: UP
- tapOn: 'Ponto 4, à direita, a curva que cai depressa até perto de zero, sem rótulo'
- scrollUntilVisible:
