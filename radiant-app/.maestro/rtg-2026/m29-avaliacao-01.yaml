- scrollUntilVisible:
    element:
      text: 'Associar T1 longo a Chega ao pulso seguinte com menos magnetização'
- tapOn: 'Associar T1 longo a Chega ao pulso seguinte com menos magnetização'
- scrollUntilVisible:
