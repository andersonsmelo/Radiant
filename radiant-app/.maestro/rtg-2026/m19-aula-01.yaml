      text: 'Subir O retificador deixa a corrente num só sentido'
- tapOn: 'Subir O retificador deixa a corrente num só sentido'
- scrollUntilVisible:
    element:
      text: 'Selecionar esta ordem'
    direction: DOWN
    centerElement: true
- tapOn: 'Selecionar esta ordem'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
# interaction i3 label
- scrollUntilVisible:
    element:
      text: 'Ponto 1, à esquerda, o círculo com uma onda desenhada, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, à esquerda, o círculo com uma onda desenhada, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Rede elétrica'
- tapOn:
    id: 'label-chip-Rede elétrica'
- scrollUntilVisible:
    element:
      text: 'Ponto 2, no alto, duas bobinas, a da direita com mais voltas, sem rótulo'
    direction: UP
- tapOn: 'Ponto 2, no alto, duas bobinas, a da direita com mais voltas, sem rótulo'
- scrollUntilVisible:
