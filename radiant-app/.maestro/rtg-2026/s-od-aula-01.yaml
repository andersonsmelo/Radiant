      text: 'Associar Ápice a Ponta da raiz do dente'
- tapOn: 'Associar Ápice a Ponta da raiz do dente'
- scrollUntilVisible:
    element:
      text: 'Associar Raiz a Parte do dente que fica dentro do osso'
- tapOn: 'Associar Raiz a Parte do dente que fica dentro do osso'
- scrollUntilVisible:
    element:
      text: 'Associar Mandíbula a Osso da arcada de baixo'
- tapOn: 'Associar Mandíbula a Osso da arcada de baixo'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
# interaction i3 cloze
- scrollUntilVisible:
