- tapOn:
    id: 'lesson-option-option:rtg-2026:s-od:aula-01:i4:b'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 7 de 8'
# interaction i5 case-decision
- scrollUntilVisible:
