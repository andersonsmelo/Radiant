      text: 'Ponto 5, no gráfico da direita, o traço em S, junto ao patamar alto, sem rótulo'
    direction: UP
- tapOn: 'Ponto 5, no gráfico da direita, o traço em S, junto ao patamar alto, sem rótulo'
- scrollUntilVisible:
