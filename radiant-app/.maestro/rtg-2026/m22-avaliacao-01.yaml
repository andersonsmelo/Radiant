- openLink: 'radiantapp://checkpoint?nodeId=node%3Acheckpoint%3Artg-2026%3Am22%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Começar avaliação'
    timeout: 15000
- tapOn: 'Começar avaliação'
# item 1
- scrollUntilVisible:
