- scrollUntilVisible:
    element:
      text: 'Ponto 4, no alto, a ponta direita do colchete azul, sem rótulo'
    direction: UP
- tapOn: 'Ponto 4, no alto, a ponta direita do colchete azul, sem rótulo'
- scrollUntilVisible:
