appId: com.ascendcreative.radiant
name: 'RTG M31: aula 01 até o resumo'
tags:
  - rtg-2026
  - generated
---
# Gerado por scripts/qa/generate-rtg-maestro.mjs a partir da aula-fonte. Não edite à mão.
# Entrada pelo link da rota /learn. LessonFlowScreen não recusa nó bloqueado e a aula 01 não tem unlockRule,
# então a unidade abre numa instalação limpa, mesmo que a trilha a mostre atrás do cadeado. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am31%3Aaula-01&nodeId=node%3Aactivity%3Artg-2026%3Am31%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m31:aula-01:i1:c'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m31:aula-01:i1:c'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
# interaction i2 hotspot
- scrollUntilVisible:
    element:
      text: 'Selecionar Calha de espuma na imagem'
- tapOn: 'Selecionar Calha de espuma na imagem'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
# interaction i3 conversation
- scrollUntilVisible:
    element:
      id: 'conversation-option-Entendo\. O veterinário decide como ele fica parado; aviso a equipe\.'
- tapOn:
    id: 'conversation-option-Entendo\. O veterinário decide como ele fica parado; aviso a equipe\.'
- scrollUntilVisible:
    element:
      id: 'conversation-option-Não prometo resultado; a equipe faz o possível e orienta a senhora\.'
- tapOn:
    id: 'conversation-option-Não prometo resultado; a equipe faz o possível e orienta a senhora\.'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 6 de 8'
# interaction i4 true-false
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- assertVisible: 'Afirmação 2 de 3'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 3 de 3'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 7 de 8'
# interaction i5 multi-select
- scrollUntilVisible:
    element:
      id: 'multi-select-Avisar o veterinário de que ela está agitada'
- tapOn:
    id: 'multi-select-Avisar o veterinário de que ela está agitada'
- scrollUntilVisible:
    element:
      id: 'multi-select-Ajudar a pôr os apoios que a equipe indicar'
- tapOn:
    id: 'multi-select-Ajudar a pôr os apoios que a equipe indicar'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 8 de 8'
- tapOn: 'Concluir e voltar'
- assertVisible: 'A lição foi concluída'
