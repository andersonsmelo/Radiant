appId: com.ascendcreative.radiant
name: 'RTG S-US: avaliação 1 (aula 01)'
tags:
  - rtg-2026
  - generated
---
# Gerado por scripts/qa/generate-rtg-maestro.mjs a partir da aula-fonte. Não edite à mão.
# BLOQUEADA EM INSTALAÇÃO LIMPA: a tela de avaliação mostra "Bloqueada" até a aula 01 estar concluída
# (unlockRule do nó), e o app não é alterado para contornar isso. Por isso o flow joga a aula 01 antes e só então abre a rota /checkpoint.
# Sem repetir launchApp: reaberto com clearState, o progresso se perderia. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3As-us%3Aaula-01&nodeId=node%3Aactivity%3Artg-2026%3As-us%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:s-us:aula-01:i1:a'
- tapOn:
    id: 'lesson-option-option:rtg-2026:s-us:aula-01:i1:a'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
# interaction i2 cloze
- scrollUntilVisible:
    element:
      id: 'cloze-token-acima'
- tapOn:
    id: 'cloze-token-acima'
- scrollUntilVisible:
    element:
      id: 'cloze-token-megahertz'
- tapOn:
    id: 'cloze-token-megahertz'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
# interaction i3 true-false
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- assertVisible: 'Afirmação 2 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 3 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-errado'
- tapOn:
    id: 'true-false-errado'
- assertVisible: 'Afirmação 4 de 4'
- scrollUntilVisible:
    element:
      id: 'true-false-certo'
- tapOn:
    id: 'true-false-certo'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 6 de 8'
# interaction i4 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:s-us:aula-01:i4:b'
- tapOn:
    id: 'lesson-option-option:rtg-2026:s-us:aula-01:i4:b'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 7 de 8'
# interaction i5 case-decision
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:s-us:aula-01:i5:c'
- tapOn:
    id: 'lesson-option-option:rtg-2026:s-us:aula-01:i5:c'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 8 de 8'
- tapOn: 'Concluir e voltar'
- assertVisible: 'A lição foi concluída'
- openLink: 'radiantapp://checkpoint?nodeId=node%3Acheckpoint%3Artg-2026%3As-us%3Aaula-01'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Começar avaliação'
    timeout: 15000
- tapOn: 'Começar avaliação'
# item 1
- scrollUntilVisible:
    element:
      text: 'Frequência acima de 20 kHz'
- tapOn: 'Frequência acima de 20 kHz'
- scrollUntilVisible:
    element:
      text: 'Próxima questão'
- tapOn: 'Próxima questão'
# item 2
- scrollUntilVisible:
    element:
      text: '5 MHz'
- tapOn: '5 MHz'
- scrollUntilVisible:
    element:
      text: 'Enviar avaliação'
- tapOn: 'Enviar avaliação'
- extendedWaitUntil:
    visible: 'Avaliação concluída'
    timeout: 15000
