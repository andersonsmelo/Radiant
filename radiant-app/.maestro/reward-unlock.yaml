# ── Unidade 3 ────────────────────────────────────────────────────────────────
- assertVisible: 'Quiz: Profissão e atuação do técnico em radiologia'
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual órgão regulamenta o exercício da profissão de técnico em radiologia no Brasil\?'
- scrollUntilVisible:
