# ── Checkpoint 6 — o último ──────────────────────────────────────────────────
# `buildUnit` cria checkpoint para toda lição menos a última, então são seis
# para sete lições. Este é o `lessons.length - 2`, o único cujo título é
# "Checkpoint da unidade" — os anteriores são "Checkpoint N".
- repeat:
