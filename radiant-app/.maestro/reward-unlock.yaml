appId: com.ascendcreative.radiant
name: Reward unlocks only after the last lesson of the track
tags:
  - reward
  - unlock-rule
  - critical-path
---
# A outra metade da conquista. `reward-locked.yaml` cobre o nó pelo deep link e
# prova o estado bloqueado; ele **não** prova a regra de destravamento, e diz
# isso de si mesmo. Esta é a regra: `JourneyDefinitionService` abre o reward com
# `requiresNodeIds: [node:<última lição>]`, e a trilha ativa tem sete lições
# encadeadas uma na outra — lição → lição, seis vezes. Até a ADR de 2026-09-28
# havia um checkpoint de botão entre cada par; ele saiu.
#
# Os dois flows apontam para o **mesmo** nó, `node:reward:fundamentos:final`.
# Um afirma que ele não se deixa coletar bloqueado; o outro, que ele se deixa
# coletar depois de sete lições, e só depois. Separados, cada um passa por
# metade do motivo errado.
#
# ⚠️ Este flow **não pode** alcançar o reward por deep link. Chegar por
# `radiantapp://reward?nodeId=…` provaria de novo o que o irmão já prova e
# deixaria a regra descoberta outra vez, sem que nada ficasse vermelho. O
# caminho é o do produto: o CTA da home, que sai de `continueLabel` em
# `JourneyHomeScreen`, que leva de uma lição à seguinte e, no fim, à conquista.
# `scripts/maestro-contract.test.mjs` proíbe o deep link aqui.
#
# Custo: sete lições, ~3× a `learning-critical-path`.
# Ele é longo porque a regra é longa — encurtar a trilha exigiria fixture, e
# uma fixture de 2 lições cai no ramo `lessonCount <= 2` de `rewardNodeId()`,
# que constrói um id que produção nunca constrói.
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
# O dev client entra por espera explícita, e não por `runFlow when`, que é
# avaliado uma vez só e perde a folha que sobe depois (medido em 2026-09-24 e
# de novo em 2026-09-28; ver o subflow).
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# Desde os consertos de acessibilidade da 1.4, o contador é lido junto com o
# título no rótulo do cabeçalho ("<trilha>. N de M etapas concluídas."), e o
# texto solto "N de M" não aparece mais na árvore. Medido em 2026-09-28.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
# O prazo de 120 s não substitui a espera: a trilha já está na árvore (o
# `assertVisible` acima), e o cabeçalho existe, só que acima da dobra. Medido em
# 2026-10-16: com o fundo animado a tela não assenta, cada tentativa custa ~8 s,
# e depois da 1ª lição o convite do lembrete sobe por cima do cabeçalho. Como a
# trilha abre no PRÓXIMO, a distância cresce a cada lição: as oito rolagens
# levaram 0,1 / 8 / 17 / 25 / 33 / 33 / 41 / 50 s. Os 20 s padrão acabaram na 4ª
# com o cabeçalho já na tela, e 60 s deixariam a 8ª com 10 s de folga.
# Com `radiantReduceMotion` (FILA 49, medido em 2026-10-18), a tentativa caiu
# para 2,3–3,7 s e a 8ª rolagem para 21 s: ainda acima dos 20 s padrão, por
# isso o prazo fica. O que resta é a desaceleração da própria lista.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
    timeout: 120000
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'

# ── Unidade 1 ────────────────────────────────────────────────────────────────
# Só a primeira lição entra por deep link, como na `learning-critical-path`:
# é o ponto de partida determinístico. Daqui em diante quem navega é o app.
- openLink:
    link: radiantapp://learn?nodeId=node%3Alesson-1&blockId=block%3Alesson-1%3Aintro
- runFlow:
    when:
      visible: 'Abrir com “Radiant”\?'
    commands:
      - tapOn: Abrir
- assertVisible: Fundamentos de Radiologia
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
# O resumo da lição (`LessonSummary`), que entrou na 1.4, fica entre a lição
# e a trilha. Este flow é anterior a ele e seguia direto para a trilha;
# medido em 2026-09-28, no simulador, parava aqui.
- assertVisible: A lição foi concluída
- tapOn: Continuar
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
    timeout: 120000
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'

# ── Para a lição 2 ───────────────────────────────────────────────────────────
# Sem checkpoint entre as lições (ADR de 2026-09-28): o próximo nó recomendado é
# a lição seguinte, e o CTA da home diz "Continuar jornada". Centralizar o
# botão do header rolável antes de tocar preserva alcance em telas curtas.
- scrollUntilVisible:
    element:
      id: journey-recommendation-action
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
# Volta do centramento (2026-10-18). O `centerElement` do Maestro 2.7 dá UM
# deslize fixo (~505 pt num iPhone 17 Pro) quando o centro do botão está a
# mais de 1/5 da altura do centro da tela, e aceita onde ele parar. Com o
# centro entre ~611 e ~690 pt, o botão para sob o HUD, ainda "visível" na
# árvore, e o toque cai no HUD (medido no `reward-unlock`, 3ª lição). A volta
# para cima não faz nada se o botão já está na faixa central e o devolve à
# posição anterior, livre do HUD e da barra de abas, se passou.
- assertVisible:
    id: journey-recommendation-action
- scrollUntilVisible:
    element:
      id: journey-recommendation-action
    direction: UP
    centerElement: true
    visibilityPercentage: 100
- tapOn: Continuar jornada

