      id: journey-recommendation-action
    direction: UP
    centerElement: true
    visibilityPercentage: 100
- tapOn: Receber conquista
- assertVisible: Conquista da unidade
# O espelho exato da asserção do flow irmão: lá, "Bloqueada até a unidade
# fechar"; aqui, o mesmo `GalaxyStatRow` dizendo o contrário sobre o mesmo nó.
# Em telas curtas, alcançar a linha pelo rótulo acessível antes de afirmar.
- repeat:
    times: 10
    while:
      notVisible: Pronta para ser coletada
    commands:
      - scroll
- assertVisible: Pronta para ser coletada
# 8 nós primários na unidade (7 lições + o reward); 7 feitos. Eram 14 até a
# ADR de 2026-09-28, com os 6 checkpoints. Este número é o que separa "a tela
# mudou de texto" de "o progresso existe": era exatamente ele, em "0 de 14",
# que denunciava o defeito de 2026-08-04.
- assertVisible: 7 de 8 marcos da unidade concluídos
# Rolar até o card de ação antes de afirmar. A presença também precisa do lugar
# onde ela apareceria estar sendo olhado — e nesta tela todo nó expõe
# `accessibilityText` com `text` vazio, então `scrollUntilVisible` não resolve.
- repeat:
    times: 10
    while:
      notVisible: 'Pronto para coletar essa conquista\?'
    commands:
      - scroll
# O `?` é escapado porque o seletor do Maestro é regex de casamento total: sem
# a barra, `a?` torna o "a" opcional e o "?" literal fica sem nada para casar —
# a asserção passaria a valer para uma tela que não existe.
- assertVisible: 'Pronto para coletar essa conquista\?'
- assertVisible: Receber conquista
- tapOn: Receber conquista
# A coleta gravou. Sem esta parte o flow provaria que o botão aparece, não que
# ele faz o que promete.
- assertVisible: Conquista registrada
- assertVisible: Salva no seu progresso
- assertVisible: 8 de 8 marcos da unidade concluídos
