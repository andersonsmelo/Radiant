appId: com.ascendcreative.radiant
name: Store review after real first value and three app opens
tags:
  - rating-prompt
  - production-config
  - requires-review-fixture
---
# Exige perfil production, L1 concluída e seu cartão sintético devido.
# Preparar antes de executar, com o app parado; não injetar telemetria.
# Não limpar estado: a conclusão real criou o marco de primeiro valor.
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- openLink:
    link: radiantapp://review
- assertVisible: Revisão
- scrollUntilVisible:
    element: Começar revisão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Começar revisão
- assertVisible: Micro revisão
- scrollUntilVisible:
    element: Mostrar resposta
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Mostrar resposta
- assertVisible: Resposta correta
- scrollUntilVisible:
    element: Acertei
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Acertei
# A prova é o diálogo da Apple; não substitua por evento de elegibilidade.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: 'Curtindo o app Radiant\?'
      - takeScreenshot: rating-prompt-ios-dialog
      - tapOn: Agora Não
- assertVisible: Sessão concluída
- scrollUntilVisible:
    element: Resultado da sessão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- assertVisible: Resultado da sessão
