appId: com.ascendcreative.radiant
name: Store review after real first value and three app opens
tags:
  - rating-prompt
  - production-config
  - requires-review-fixture
---
# Exige perfil production, L1 concluída e seu cartão sintético devido.
# Vencer UM item do journal atual; usar agregado só se ainda não migrado.
# Preparar antes de executar, com o app parado; não injetar telemetria.
# Não limpar estado: a conclusão real criou o marco de primeiro valor.
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. 1 de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. 1 de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. 1 de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. 1 de \d+ etapas concluídas\.$'
- openLink:
    link: radiantapp://review
- assertVisible: Revisão
- scrollUntilVisible:
    element: Começar revisão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Começar revisão
- assertVisible: Sessão ativa
- scrollUntilVisible:
    element:
      id: review-option-0
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: review-option-0
- scrollUntilVisible:
    element: Confirmar resposta
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Confirmar resposta
- assertVisible: 'Resposta correta|Vamos revisar este ponto'
- scrollUntilVisible:
    element: Continuar
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Continuar
# A prova é o diálogo da Apple; não substitua por evento de elegibilidade.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: 'Curtindo o app Radiant\?'
      - takeScreenshot: rating-prompt-ios-dialog
      - tapOn: Agora Não
- assertVisible: Sessão concluída
- scrollUntilVisible:
    element: Resultado da sessão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- assertVisible: Resultado da sessão
