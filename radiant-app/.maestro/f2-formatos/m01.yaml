      text: 'Higienizar as mãos antes de qualquer contato.'
    direction: DOWN
    timeout: 15000
- tapOn: 'Higienizar as mãos antes de qualquer contato.'
- tapOn: Conferir resposta
- tapOn: Continuar
# i5, múltipla seleção: erro (falta uma correta).
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: 'multi-select-Limpar os apoios que ela tocou.'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'multi-select-Limpar os apoios que ela tocou.'
- tapOn: Conferir resposta
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: 'Higienizar as mãos antes da próxima paciente., faltou marcar, errado'
    direction: DOWN
    timeout: 15000
- tapOn: Continuar
- repeat:
    while:
      notVisible: Concluir e voltar
    commands:
      - tapOn: Continuar
- tapOn: Concluir e voltar
