appId: com.ascendcreative.radiant
name: Local-first learning path through two lessons and progress
tags:
  - critical-path
  - local-first
---
- launchApp:
    clearState: true
    permissions:
      all: deny
# O dev client entra por espera explícita, e não por `runFlow when`, que é
# avaliado uma vez só e perde a folha que sobe depois (medido em 2026-09-24 e
# de novo em 2026-09-28; ver o subflow).
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml
- openLink:
    link: radiantapp://learn?nodeId=node%3Alesson-1&blockId=block%3Alesson-1%3Aintro
- runFlow:
    when:
      visible: 'Abrir com “Radiant”\?'
    commands:
      - tapOn: Abrir
- assertVisible: Fundamentos de Radiologia
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
# A régua é a mesma que `reward-unlock.yaml` usa para este seletor, e o contrato
# exige que seja. Ela saiu de medição, não de gosto: em 2026-08-06 o padrão de
# 100% reprovou uma opção que estava na tela e clicável, porque um brilho
# decorativo cobria ~11% dos bounds no Android. Dois flows exigindo 100 e um
# exigindo 80 sobre o MESMO elemento da MESMA tela é uma contradição que só
# aparece queimando uma janela de aparelho de 15 minutos.
- scrollUntilVisible:
    element:
      id: lesson-option-q1:option:1
    direction: DOWN
    centerElement: true
    visibilityPercentage: 80
- tapOn:
    id: lesson-option-q1:option:1
- tapOn: Continuar
# Reinforce step after an answered question shows the answer feedback
# ("Resposta correta"/"Vamos reforçar"), not the payload title. Assert the
# always-present last-step footer action instead.
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar
# O resumo da lição (`LessonSummary`), que entrou na 1.4, fica entre a lição
# e a trilha. Este flow é anterior a ele e seguia direto para a trilha;
# medido em 2026-09-28, no simulador, parava aqui.
- assertVisible: A lição foi concluída
- tapOn: Continuar
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# Desde os consertos de acessibilidade da 1.4, o contador é lido junto com o
# título no rótulo do cabeçalho ("<trilha>. N de M etapas concluídas."), e o
# texto solto "N de M" não aparece mais na árvore. Medido em 2026-09-28.
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# Sem checkpoint entre as lições desde a ADR de 2026-09-28: o próximo nó
# recomendado é a lição seguinte, e o CTA da home diz "Continuar jornada"
# (`continueLabel` em `JourneyHomeScreen`, pinado pelo contrato).
# The home CTA renders after the full journey map, far below the fold. It is an
# AppButton, which sets accessibilityRole+accessibilityLabel on the Pressable,
# so iOS collapses the inner Text and the node exposes only accessibilityText.
# scrollUntilVisible's `element.text` matches the text attribute only and never
# resolves here; `visible`/`tapOn` do match accessibilityText, so scroll with a
# guarded repeat instead.
- repeat:
    times: 15
    while:
      notVisible: Continuar jornada
    commands:
      - scroll
# The guarded repeat stops the moment the CTA enters the tree, which on a fast
# Android emulator leaves it resting UNDER the floating tab bar (measured: CTA at
# y2212-2277 vs tab bar y2198-2387), so a bare tapOn lands on the bar. One more
# scroll lifts the CTA clear of the bar before the tap. (iOS and slower Androids
# happened to leave it tappable; this makes it deterministic on both.)
- scroll
- tapOn: Continuar jornada
- assertVisible: Princípios de Tomografia Computadorizada
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'A principal vantagem da TC em relação à radiografia simples é:'
# A régua é a mesma que `reward-unlock.yaml` usa para este seletor, e o contrato
# exige que seja. Ela saiu de medição, não de gosto: em 2026-08-06 o padrão de
# 100% reprovou uma opção que estava na tela e clicável, porque um brilho
# decorativo cobria ~11% dos bounds no Android. Dois flows exigindo 100 e um
# exigindo 80 sobre o MESMO elemento da MESMA tela é uma contradição que só
# aparece queimando uma janela de aparelho de 15 minutos.
- scrollUntilVisible:
    element:
      id: lesson-option-ct-q3:option:2
    direction: DOWN
    centerElement: true
    visibilityPercentage: 80
- tapOn:
    id: lesson-option-ct-q3:option:2
- tapOn: Continuar
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar
- assertVisible: A lição foi concluída
- tapOn: Continuar
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# The reward node is deliberately NOT covered here. The active track is
# generated from the catalog (7 lessons), not from defaultTrack.ts (2 lessons),
# and JourneyDefinitionService unlocks the reward only after the LAST lesson —
# so the achievement stays "Bloqueado" at this point and is unreachable in a
# smoke run. This flow proves the local-first loop through progress instead:
# lesson -> home -> next lesson -> progress. (Until the ADR of 2026-09-28 a
# catalog checkpoint and its celebration sat between the two lessons.)
# Progresso e Missões deixaram de ser abas em 2026-08-21: viraram seções da aba
# Perfil, junto da identidade do aluno. A barra tem duas abas.
# The tab's accessible name differs per platform: iOS composes
# "Perfil, tab, 2 of 2" while Android exposes just "Perfil" (maestro hierarchy,
# both platforms, 2026-07-28). Anchor the selector to the tab — a loose
# `.*Perfil.*` would also match any caption containing the word, and Maestro
# matches case-insensitively. `^Perfil(, tab.*)?$` matches only the tab.
- tapOn: '^Perfil(, tab.*)?$'
# Missões é a primeira seção do Perfil, então este título é o que aparece sem
# rolar. `PROGRESSO` está mais abaixo e exigiria scroll.
- assertVisible: Desafios de hoje
