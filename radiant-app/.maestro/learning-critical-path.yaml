appId: com.ascendcreative.radiant
name: Local-first learning path through checkpoint and progress
tags:
  - critical-path
  - local-first
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in your development builds.'
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: 'Connected to:'
    commands:
      - tapOn: Close
- openLink:
    link: radiantapp://learn?nodeId=node%3Alesson-1&blockId=block%3Alesson-1%3Aintro
- runFlow:
    when:
      visible: 'Abrir com “Radiant”?'
    commands:
      - tapOn: Abrir
- assertVisible: Fundamentos de Radiologia
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: Qual é a principal função dos raios-X na radiologia diagnóstica?
- scrollUntilVisible:
    element:
      id: lesson-option-q1:option:1
    direction: DOWN
    centerElement: true
- tapOn:
    id: lesson-option-q1:option:1
- tapOn: Continuar
# Reinforce step after an answered question shows the answer feedback
# ("Resposta correta"/"Vamos reforçar"), not the payload title. Assert the
# always-present last-step footer action instead.
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar
- assertVisible: Foco de hoje
# The home CTA renders after the full journey map, far below the fold. It is an
# AppButton, which sets accessibilityRole+accessibilityLabel on the Pressable,
# so iOS collapses the inner Text and the node exposes only accessibilityText.
# scrollUntilVisible's `element.text` matches the text attribute only and never
# resolves here; `visible`/`tapOn` do match accessibilityText, so scroll with a
# guarded repeat instead.
- repeat:
    times: 15
    while:
      notVisible: Abrir checkpoint
    commands:
      - scroll
# The guarded repeat stops the moment the CTA enters the tree, which on a fast
# Android emulator leaves it resting UNDER the floating tab bar (measured: CTA at
# y2212-2277 vs tab bar y2198-2387), so a bare tapOn lands on the bar and the
# checkpoint never opens. One more scroll lifts the CTA clear of the bar before
# the tap. (iOS and slower Androids happened to leave it tappable; this makes it
# deterministic on both.)
- scroll
- tapOn: Abrir checkpoint
- assertVisible: Checkpoint
# Same pattern on every screen below: the footer action sits past the fold, and
# the guarded repeat is a no-op when the element is already visible.
- repeat:
    times: 15
    while:
      notVisible: Concluir checkpoint
    commands:
      - scroll
# Lift the CTA clear of the floating tab bar before tapping (see note above).
- scroll
- tapOn: Concluir checkpoint
# A celebração do checkpoint foi migrada para pt-BR em 2026-07-27 (commit
# fb1af1f): a tarja passou de inglês para "CONQUISTA DESBLOQUEADA" e o CTA
# deixou de ser um rótulo fixo — agora é o próximo nó recomendado. Depois deste
# checkpoint o próximo nó é uma lição, então o rótulo é "Abrir próxima lição".
- assertVisible: CONQUISTA DESBLOQUEADA
- repeat:
    times: 15
    while:
      notVisible: Abrir próxima lição
    commands:
      - scroll
# Lift the CTA clear of the floating tab bar before tapping (see note above).
- scroll
- tapOn: Abrir próxima lição
- assertVisible: Princípios de Tomografia Computadorizada
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'A principal vantagem da TC em relação à radiografia simples é:'
- scrollUntilVisible:
    element:
      id: lesson-option-ct-q3:option:2
    direction: DOWN
    centerElement: true
- tapOn:
    id: lesson-option-ct-q3:option:2
- tapOn: Continuar
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar
- assertVisible: Foco de hoje
# The reward node is deliberately NOT covered here. The active track is
# generated from the catalog (7 lessons), not from defaultTrack.ts (2 lessons),
# and JourneyDefinitionService unlocks the reward only after the LAST lesson —
# so the achievement stays "Bloqueado" at this point and is unreachable in a
# smoke run. This flow proves the local-first loop through progress instead:
# lesson -> checkpoint -> achievement -> next lesson -> progress.
# The tab's accessible name differs per platform: iOS composes
# "Progresso, tab, 3 of 4" while Android exposes just "Progresso" (maestro
# hierarchy, both platforms, 2026-07-28). Anchor the selector to the tab: a
# loose `.*Progresso.*` also matches the home caption "Seu progresso fica salvo
# no aparelho..." — Maestro matches case-insensitively and that caption sits
# above the tab in the tree, so the tap lands on the caption and Progresso never
# opens (it broke both platforms). `^Progresso(, tab.*)?$` matches only the tab.
- tapOn: '^Progresso(, tab.*)?$'
- assertVisible: PROGRESSO
