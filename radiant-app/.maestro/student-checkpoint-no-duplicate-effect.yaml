appId: com.ascendcreative.radiant
name: Active internal checkpoint does not duplicate the lesson effect after relaunch
tags:
  - checkpoint
  - active-internal
  - idempotency
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml
- openLink:
    link: radiantapp://learn?nodeId=node%3Alesson-1&blockId=block%3Alesson-1%3Aintro
- runFlow:
    when:
      visible: 'Abrir com “Radiant”\?'
    commands:
      - tapOn: Abrir
- assertVisible: Fundamentos de Radiologia
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
- assertVisible: A lição foi concluída
- tapOn: Continuar
# Cabeçalho acessível da Estude, incluindo título e progresso agrupados.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# O valor é capturado, não fixado. XP é base mais bônus, então afirmar um número
# literal amarraria o flow às regras de gamificação em vez de à idempotência —
# que é a propriedade sob teste. O medidor expõe `accessibilityLabel` no formato
# "N XP", que é seletor estável.
- copyTextFrom:
    text: '^[0-9][0-9.,]* XP$'
- killApp
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
# A lição foi concluída, então não há retomada a oferecer — o que o relançamento
# exercita é a reconciliação do journal. Se ela reaplicasse o efeito, o XP
# dobraria.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
- assertVisible: ${maestro.copiedText}
