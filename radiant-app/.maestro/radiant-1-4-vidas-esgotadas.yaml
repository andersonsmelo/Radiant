appId: com.ascendcreative.radiant
name: Caminho dourado 3 — primeiro contato grátis e erro no retorno esgota vidas
tags:
  - golden-path
  - radiant-1-4
---
# ADR de 2026-10-18: só o erro no retorno custa vida. Sem injeção de estado.
# A primeira pergunta erra no contato e no retorno; as outras duas acertam.
# Cinco sessões consomem cinco vidas, uma por sessão; a quinta ainda conclui
# (ADR de 2026-10-18, régua e última vida). A sexta, sem vidas, faz o primeiro
# contato e é barrada ao conferir o retorno, antes de a resposta contar.
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^Fundamentos de Radiologia\. Próximo passo\.$'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 100
- tapOn: '^Fundamentos de Radiologia\. Próximo passo\.$'
- assertVisible: 'Passo 1 de 5'
- assertVisible: '5 de 5 vidas'
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:0'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:0'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Vamos reforçar
- assertVisible: '5 de 5 vidas'
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
