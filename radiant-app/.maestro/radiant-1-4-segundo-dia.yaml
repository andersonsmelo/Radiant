appId: com.ascendcreative.radiant
name: Caminho dourado 2 — segundo dia com revisão devida
tags:
  - golden-path
  - radiant-1-4
  - real-clock
---
# Spec 1.4 (2026-09-14), §8, item 6: "segundo dia com revisão devida".
#
# PRÉ-CONDIÇÃO — relógio real, sem atalho. Este flow NÃO prepara o próprio
# estado: ele parte do fim do `radiant-1-4-primeira-execucao.yaml`, rodado no
# MESMO simulador pelo menos 24 horas antes, sem clearState no meio. O app não
# oferece injeção de relógio nem de estado (medido em 2026-09-24), e a revisão
# vence no mínimo 1 dia depois da lição (`SR_SAFETY_CAPS.MIN_INTERVAL_DAYS`).
# Decidido pelo dono em 2026-09-24: relógio real em duas partes, em vez de
# editar o armazenamento do app por fora.
#
# Rodado antes das 24 horas, ele REPROVA na primeira asserção — a revisão
# ainda está "Bloqueado". É o comportamento pretendido: sem clearState, o flow
# não tem como passar vazio.
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    permissions:
      all: deny
- runFlow: subflows/dismiss-dev-client.yaml
# Revisão devida vence a lição seguinte na recomendação (`NextNodeResolver`), e o
# nó recomendado anuncia o motivo no lugar do estado.
- assertVisible: '^Revisar Fundamentos de Radiologia\. Revisão devida · \d+ (devida|devidas)\.$'
- tapOn: '^Revisar Fundamentos de Radiologia\. Revisão devida · \d+ (devida|devidas)\.$'
# A atividade de revisão tem 4 passos (abertura e as três perguntas), e não os
# 5 da lição, que tem também a Ideia-chave. Medido em 2026-10-18 numa sonda com
# os cartões vencidos por fixture. A última passagem nativa com "5" é de
# 2026-09-25.
- assertVisible: 'Passo 1 de 4'
- assertVisible: 'Retome rapidamente o conceito central antes de seguir adiante.'
- tapOn: Continuar
- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
- assertVisible: Revisão concluída
- tapOn: Continuar
# Desde `a366295` (2026-10-12), o nó de revisão com a próxima data no futuro
# anuncia essa data no lugar de "Concluído" (`getStatusCopy`, em
# `JourneyNodeCard.tsx`). O ícone continua o selo de concluído.
- assertVisible: '^Revisar Fundamentos de Radiologia\. Disponível em \d{2}/\d{2}/\d{4} às \d{2}:\d{2}\.$'
