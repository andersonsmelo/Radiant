appId: com.ascendcreative.radiant
name: Onboarding to local-first home
tags:
  - smoke
  - onboarding
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in your development builds.'
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: 'Connected to:'
    commands:
      - tapOn: Close
- openLink:
    link: radiantapp://onboarding
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: 'Abrir com “Radiant”?'
    commands:
      - tapOn: Abrir
- assertVisible: WELCOME TO RADIANT
- tapOn: Get started →
- assertVisible: WHY RADIANT
- tapOn: Continue →
- assertVisible: STEP 3 OF 4
- tapOn: Chest & thorax, 120 cases
- tapOn: 10 min por dia, ritmo Steady
- tapOn: Build my plan →
- assertVisible: Foco de hoje
