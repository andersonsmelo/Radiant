appId: com.ascendcreative.radiant
name: 'Figuras M24 aula-02'
tags:
  - figuras
  - generated
---
# Gerado por scripts/qa/figuras-no-simulador.mjs a partir das aulas-fonte. Não edite à mão.
# Entrada pelo link da rota /learn, como os roteiros da trilha, respondendo certo até o passo da figura. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am24%3Aaula-02&nodeId=node%3Aactivity%3Artg-2026%3Am24%3Aaula-02'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- takeScreenshot: 'figura-joelho-frente-e-perfil-m24-aula-02-passo2'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m24:aula-02:i1:c'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m24:aula-02:i1:c'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
- takeScreenshot: 'figura-joelho-frente-e-perfil-m24-aula-02-passo4'
