appId: com.ascendcreative.radiant
name: 'Figuras M18 aula-05'
tags:
  - figuras
  - generated
---
# Gerado por scripts/qa/figuras-no-simulador.mjs a partir das aulas-fonte. Não edite à mão.
# Entrada pelo link da rota /learn, como os roteiros da trilha, respondendo certo até o passo da figura. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am18%3Aaula-05&nodeId=node%3Aactivity%3Artg-2026%3Am18%3Aaula-05'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- takeScreenshot: 'figura-marcos-de-superficie-m18-aula-05-passo2'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m18:aula-05:i1:b'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m18:aula-05:i1:b'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
- takeScreenshot: 'figura-marcos-de-superficie-m18-aula-05-passo4'
# interaction i2 label
- scrollUntilVisible:
    element:
      text: 'Ponto 1, no alto, o afundamento na base do pescoço, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, no alto, o afundamento na base do pescoço, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Incisura jugular'
- tapOn:
    id: 'label-chip-Incisura jugular'
- scrollUntilVisible:
    element:
      text: 'Ponto 2, no centro do peito, a ponta de baixo do osso reto, sem rótulo'
    direction: UP
- tapOn: 'Ponto 2, no centro do peito, a ponta de baixo do osso reto, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Processo xifoide'
- tapOn:
    id: 'label-chip-Processo xifoide'
- scrollUntilVisible:
    element:
      text: 'Ponto 3, lado esquerdo do paciente, a borda curva da cintura, sem rótulo'
    direction: UP
- tapOn: 'Ponto 3, lado esquerdo do paciente, a borda curva da cintura, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Crista ilíaca'
- tapOn:
    id: 'label-chip-Crista ilíaca'
- scrollUntilVisible:
    element:
      text: 'Ponto 4, embaixo no centro, onde os dois ossos se encontram, sem rótulo'
    direction: UP
- tapOn: 'Ponto 4, embaixo no centro, onde os dois ossos se encontram, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Sínfise púbica'
- tapOn:
    id: 'label-chip-Sínfise púbica'
- scrollUntilVisible:
    element:
      text: 'Ponto 5, lado esquerdo do paciente, a saliência lateral da coxa, sem rótulo'
    direction: UP
- tapOn: 'Ponto 5, lado esquerdo do paciente, a saliência lateral da coxa, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Trocânter maior'
- tapOn:
    id: 'label-chip-Trocânter maior'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
- takeScreenshot: 'figura-marcos-de-superficie-m18-aula-05-passo5'
