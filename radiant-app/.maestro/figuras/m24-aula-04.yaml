appId: com.ascendcreative.radiant
name: 'Figuras M24 aula-04'
tags:
  - figuras
  - generated
---
# Gerado por scripts/qa/figuras-no-simulador.mjs a partir das aulas-fonte. Não edite à mão.
# Entrada pelo link da rota /learn, como os roteiros da trilha, respondendo certo até o passo da figura. Não medido em aparelho.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: ../subflows/dismiss-dev-client.yaml
- runFlow: ../subflows/dismiss-first-run.yaml
- assertVisible:
    id: journey-trail
- openLink: 'radiantapp://learn?blockId=activity%3Artg-2026%3Am24%3Aaula-04&nodeId=node%3Aactivity%3Artg-2026%3Am24%3Aaula-04'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Passo 1 de 8'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- tapOn: 'Continuar'
- assertVisible: 'Passo 2 de 8'
- tapOn: 'Continuar'
- assertVisible: 'Passo 3 de 8'
# interaction i1 multiple-choice
- scrollUntilVisible:
    element:
      id: 'lesson-option-option:rtg-2026:m24:aula-04:i1:a'
- tapOn:
    id: 'lesson-option-option:rtg-2026:m24:aula-04:i1:a'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 4 de 8'
- takeScreenshot: 'figura-pelve-de-frente-m24-aula-04'
# interaction i2 label
- scrollUntilVisible:
    element:
      text: 'Ponto 1, à esquerda da figura, a asa larga, no alto, sem rótulo'
    direction: UP
- tapOn: 'Ponto 1, à esquerda da figura, a asa larga, no alto, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Ílio'
- tapOn:
    id: 'label-chip-Ílio'
- scrollUntilVisible:
    element:
      text: 'Ponto 2, no centro, o osso triangular com quatro pares de furos, sem rótulo'
    direction: UP
- tapOn: 'Ponto 2, no centro, o osso triangular com quatro pares de furos, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Sacro'
- tapOn:
    id: 'label-chip-Sacro'
- scrollUntilVisible:
    element:
      text: 'Ponto 3, à direita, a linha entre o osso central e a asa larga, sem rótulo'
    direction: UP
- tapOn: 'Ponto 3, à direita, a linha entre o osso central e a asa larga, sem rótulo'
- scrollUntilVisible:
    element:
      id: 'label-chip-Articulação sacroilíaca'
- tapOn:
    id: 'label-chip-Articulação sacroilíaca'
- tapOn: 'Conferir resposta'
- tapOn: 'Continuar'
- assertVisible: 'Passo 5 de 8'
- takeScreenshot: 'figura-pelve-de-frente-recorte-m24-aula-04'
