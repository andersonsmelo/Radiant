appId: com.ascendcreative.radiant
name: First-run welcome presents Pixel and opens the first learning step
tags:
  - smoke
  - first-run
---
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/dismiss-dev-client.yaml
- assertVisible: 'Oi, eu sou o Pixel\. Vamos tirar sua primeira radiografia\.'
- assertVisible: 'Ajuste o kV e veja a imagem mudar\.'
- repeat:
    times: 8
    commands:
      - tapOn: 'Aumentar kV'
- assertVisible: '100 kV'
- assertVisible: 'Tudo cinza parecido: o feixe atravessa demais\.'
- scrollUntilVisible:
    element: 'Radiant é um app educacional\. Não substitui avaliação, diagnóstico ou conduta médica profissional\.'
    direction: DOWN
    visibilityPercentage: 100
- assertVisible: 'Radiant é um app educacional\. Não substitui avaliação, diagnóstico ou conduta médica profissional\.'
- tapOn: 'Continuar'
- assertVisible: 'Você vai começar pelo papel dos raios-X e pelo raciocínio básico de contraste e radiopacidade.'
