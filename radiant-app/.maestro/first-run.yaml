appId: com.ascendcreative.radiant
name: First-run welcome presents Pixel and opens the first learning step
tags:
  - smoke
  - first-run
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in your development builds.'
    commands:
      - tapOn: Continue
- assertVisible: '^Tela 1 de 3\. Oi, eu sou o Pixel\..*$'
- tapOn: 'Continuar'
- assertVisible: '^Tela 2 de 3\. Trilha, quiz e revisão\..*$'
- tapOn: 'Continuar'
- assertVisible: '^Tela 3 de 3\. Funciona offline, sem conta\..*$'
- assertVisible: '.*Radiant é um app educacional\. Não substitui avaliação, diagnóstico ou conduta médica profissional\.$'
- tapOn: 'Começar'
- assertNotVisible: '^Tela 1 de 3\. Oi, eu sou o Pixel\..*$'
- assertVisible: 'Você vai começar pelo papel dos raios-X e pelo raciocínio básico de contraste e radiopacidade.'
