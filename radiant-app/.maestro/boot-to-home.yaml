appId: com.ascendcreative.radiant
name: Clean install passes through the first-run welcome and reaches the local-first home
tags:
  - smoke
  - local-first
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in your development builds.'
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: 'Connected to:'
    commands:
      - tapOn: Close
- runFlow: subflows/dismiss-first-run.yaml
# A clean install (clearState) has no blocking wizard: v1.3 opens directly on the
# Learning Road home. The retired onboarding smoke deep-linked into an unfinished
# prototype that was removed on 2026-07-28; this flow proves what actually
# mattered — a fresh install reaches the local-first home — against a stable
# pt-BR assertion.
- assertVisible: Foco de hoje
