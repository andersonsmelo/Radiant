appId: com.ascendcreative.radiant
name: Concluir revisão direta com cartão sintético devido
tags:
  - review
  - requires-review-fixture
---
# Pré-requisito: L1 concluída; preparar somente nextReviewAt com o app parado
# num simulador descartável. Não limpar estado nem alterar o relógio.
- launchApp
- runFlow: subflows/dismiss-dev-client.yaml
- openLink:
    link: radiantapp://review
- assertVisible: Revisão
- scrollUntilVisible:
    element: Começar revisão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Começar revisão
- assertVisible: Micro revisão
- scrollUntilVisible:
    element: Mostrar resposta
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Mostrar resposta
- assertVisible: Resposta correta
- scrollUntilVisible:
    element: Acertei
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: Acertei
- assertVisible: Sessão concluída
- scrollUntilVisible:
    element: Resultado da sessão
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- assertVisible: Resultado da sessão
- assertVisible: '1 concluídos nesta rodada'
- takeScreenshot: review-completed
