appId: com.ascendcreative.radiant
name: Store screenshot capture
tags:
  - store
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/dismiss-first-run.yaml

# A home limpa nao entra na vitrine: XP e sequencia aparecem zerados. A trilha e
# percorrida primeiro e a home e capturada no fim, ja com progresso real.
- assertVisible: Foco de hoje

# CTA da home fica abaixo da dobra, e o repeat guardado para no instante em que o
# elemento entra na arvore — o que no emulador rapido o deixa sob a tab bar
# flutuante. O scroll extra levanta o CTA antes do tap.
# Scroll FIXO, sem condicao. Um `repeat ... while notVisible` reavalia a condicao
# a cada volta, e cada reavaliacao dumpa a arvore — sobre o fundo galactico, que
# anima sem parar, o dump espera o idle e pode levar minutos por iteracao (medido:
# uma execucao passou aqui em <1min, outra ficou 20min presa no mesmo ponto).
# O CTA renderiza DEPOIS do mapa inteiro da jornada, no fim da pagina: com 3
# rolagens a tela ainda estava em 'Seu proximo trecho' (verificado no screenshot
# de falha do Maestro). 12 leva ao fim; rolar alem do fim e no-op.
- repeat:
    times: 12
    commands:
      - scroll
- tapOn: Continuar jornada

- assertVisible: Fundamentos de Radiologia
- takeScreenshot: shots/02-licao
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar

- assertVisible: Qual é a principal função dos raios-X na radiologia diagnóstica?
- takeScreenshot: shots/03-quiz
# Scroll de elevacao FIXO, sem guarda — mesma correcao que o segundo quiz deste
# arquivo ja recebeu em f7b602a, aplicada aqui em 2026-08-03.
#
# A versao anterior usava `runFlow when notVisible: scrollUntilVisible`. A guarda
# nasceu de um problema real: a 1080x1920 a alternativa ja nasce visivel e a
# lista nao rola mais, entao um scrollUntilVisible com centerElement falha por
# nao conseguir centralizar. Mas ela e cega a OCLUSAO, que e o outro caso: no
# iPhone 17 Pro a alternativa esta na arvore e portanto "visivel" para a guarda,
# so que por baixo do CTA flutuante — a guarda pulava a rolagem, o tap caia no
# botao desabilitado, e o flow parava com o quiz em 0% selecionado (medido em
# 2026-08-02 e de novo em 2026-08-03).
#
# O scroll fixo serve aos dois casos porque rolar alem do fim e no-op: onde a
# lista nao rola ele nao faz nada, onde a alternativa esta oclusa ele a levanta.
# A guarda so servia a um. Visibilidade nao e tocabilidade.
- scroll
- tapOn:
    id: lesson-option-q1:option:1
- tapOn: Continuar
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar

- assertVisible: Foco de hoje
- repeat:
    times: 15
    while:
      notVisible: Abrir checkpoint
    commands:
      - scroll
- scroll
- tapOn: Abrir checkpoint
- assertVisible: Checkpoint
- takeScreenshot: shots/04-checkpoint
- repeat:
    times: 15
    while:
      notVisible: Concluir checkpoint
    commands:
      - scroll
- scroll
- tapOn: Concluir checkpoint

- assertVisible: CONQUISTA DESBLOQUEADA
- takeScreenshot: shots/05-conquista

- repeat:
    times: 15
    while:
      notVisible: Abrir próxima lição
    commands:
      - scroll
- scroll
- tapOn: Abrir próxima lição
- assertVisible: Princípios de Tomografia Computadorizada
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'A principal vantagem da TC em relação à radiografia simples é:'
# Scroll de elevacao FIXO, sem guarda. A versao anterior usava
# `runFlow when notVisible: scrollUntilVisible`, e a guarda e inutil aqui porque
# o Maestro nao modela OCLUSAO: no iPhone 16 Plus (932pt de altura) a alternativa
# fica em y850-932, dentro da tela e na arvore — logo "visivel" para a guarda —
# mas por baixo do CTA "Continuar" flutuante. A guarda pulava, o tap caia no
# botao desabilitado e o flow parava no passo 3/4 (medido em 2026-07-30).
# E o mesmo defeito ja corrigido no Android em 2026-07-29 para os CTAs abaixo da
# dobra oclusos pela tab bar: visibilidade nao e o mesmo que tocabilidade.
# No Android a 1080x1920 a lista nao rola mais neste ponto, entao o scroll e
# no-op e a alternativa segue em y1382-1534 — por isso um scroll fixo serve as
# duas plataformas, enquanto a guarda so servia a uma.
- scroll
- tapOn:
    id: lesson-option-ct-q3:option:2
- tapOn: Continuar
- assertVisible: Concluir e voltar
- tapOn: Concluir e voltar

# Agora sim: home com progresso preenchido.
- assertVisible: Foco de hoje
- takeScreenshot: shots/01-home

# Aba de progresso. Seletor ancorado: um `.*Progresso.*` solto casa antes com a
# legenda da home "Seu progresso fica salvo no aparelho...".
- tapOn: '^Progresso(, tab.*)?$'
- assertVisible: PROGRESSO
- takeScreenshot: shots/06-progresso
