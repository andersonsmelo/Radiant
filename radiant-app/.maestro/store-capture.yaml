appId: com.ascendcreative.radiant
name: Store screenshot capture
tags:
  - store
---
# `radiantReduceMotion` liga "Reduzir movimento" no app: o fundo estrelado
# para e o confete não sobe, e a tela assenta antes de cada rolagem
# (FILA 49; ver `src/ui/accessibility/motionLaunchArgument.ts`). Vale para
# todo lançamento: um processo aberto sem ele volta a animar.
- launchApp:
    arguments:
      radiantReduceMotion: '1'
    clearState: true
    permissions:
      all: deny
# O dev client entra por espera explícita (ver o subflow). Num build de loja ele
# não aparece, e a espera só custa o prazo.
- runFlow: subflows/dismiss-dev-client.yaml
- runFlow: subflows/dismiss-first-run.yaml

# A home limpa nao entra na vitrine: XP e sequencia aparecem zerados. A trilha e
# percorrida primeiro e a home e capturada no fim, ja com progresso real.
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# Desde os consertos de acessibilidade da 1.4, o contador é lido junto com o
# título no rótulo do cabeçalho ("<trilha>. N de M etapas concluídas."), e o
# texto solto "N de M" não aparece mais na árvore. Medido em 2026-09-28.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'

# A recomendação fica no header rolável; aguarde o botão antes de tocar.
- assertVisible: Continuar trilha
- tapOn: Continuar trilha

- assertVisible: Fundamentos de Radiologia
- takeScreenshot: shots/02-licao
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar

- assertVisible: 'Qual é a principal função dos raios-X na radiologia diagnóstica\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura é mais radiopaca em uma radiografia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q2:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q2:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'O que significa o termo "contraste" em radiologia\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-q3:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-q3:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
# O resumo da lição (`LessonSummary`), que entrou na 1.4, fica entre a lição
# e a trilha. Este flow é anterior a ele e seguia direto para a trilha;
# medido em 2026-09-28, no simulador, parava aqui.
- assertVisible: A lição foi concluída
- tapOn: Continuar

# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
# Até a ADR de 2026-09-28 havia um checkpoint de botão entre as duas lições, e
# esta passagem capturava `shots/04-checkpoint` e `shots/05-conquista`. Ele
# saiu da trilha, e as duas capturas saíram com ele. Os números restantes não
# foram renumerados, para não mexer em quem os consome; o que a vitrine da loja
# passa a mostrar é decisão do dono (FILA, 37).
# Centraliza o CTA antes de tocar, como `learning-critical-path.yaml`. Em
# 2026-10-18, no iPhone 17 Pro, ele estava sob a barra de abas depois do convite
# do lembrete: o toque não abriu a lição, e o título do card da home satisfez a
# asserção seguinte, que só reprovou no "Continuar" da lição.
- scrollUntilVisible:
    element:
      id: journey-recommendation-action
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
- tapOn: Continuar trilha
- assertVisible: Princípios de Tomografia Computadorizada
- tapOn: Continuar
- assertVisible: Ideia-chave
- tapOn: Continuar
- assertVisible: 'Na tomografia computadorizada, o que representa um voxel\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-ct-q1:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-ct-q1:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'Qual estrutura costuma apresentar atenuação mais baixa na TC sem contraste\?'
- scrollUntilVisible:
    element:
      id: 'lesson-option-ct-q2:option:1'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-ct-q2:option:1'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Continuar
- assertVisible: 'A principal vantagem da TC em relação à radiografia simples é:'
- scrollUntilVisible:
    element:
      id: 'lesson-option-ct-q3:option:2'
    direction: DOWN
    centerElement: false
    visibilityPercentage: 80
- tapOn:
    id: 'lesson-option-ct-q3:option:2'
- tapOn: Conferir resposta
- assertVisible:
    id: lesson-item-feedback
- assertVisible: Resposta correta
- tapOn: Concluir e voltar
- assertVisible: A lição foi concluída
- tapOn: Continuar

# Agora sim: home com progresso preenchido.
# Âncora da aba Estude. `Foco de hoje` valia até 2026-08-21, quando o card de
# retomada saiu e a aba virou a trilha. O contador do cabeçalho de estágio
# ("2 de 21") é o que existe ali e em nenhuma outra tela; o título da trilha não
# serve, porque coincide com o título de uma lição.
# A trilha abre no PRÓXIMO (2026-10-16, `f39ac9e`): o cabeçalho pode estar
# acima da tela. Espera a trilha e rola até ele antes de afirmá-lo.
- assertVisible:
    id: journey-trail
- scrollUntilVisible:
    element: '^.+\. \d+ de \d+ etapas concluídas\.$'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
- assertVisible: '^.+\. \d+ de \d+ etapas concluídas\.$'
- takeScreenshot: shots/01-home

# Aba Perfil — que desde 2026-08-21 agrega identidade, missões e progresso.
# Seletor ancorado ao rótulo da aba: um `.*Perfil.*` solto casaria com qualquer
# legenda que contivesse a palavra, e o Maestro compara sem diferenciar caixa.
- tapOn: '^Perfil(, tab.*)?$'
- assertVisible: Desafios de hoje
- takeScreenshot: shots/06-perfil
