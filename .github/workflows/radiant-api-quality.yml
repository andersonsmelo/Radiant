name: Radiant API Quality

on:
  pull_request:
    paths:
      - 'radiant-api/**'
      - '.github/workflows/radiant-api-quality.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'radiant-api/**'
      - '.github/workflows/radiant-api-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radiant-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: radiant-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
