name: Radiant App Quality

on:
  pull_request:
    paths:
      - 'radiant-app/**'
      - '.github/workflows/radiant-app-quality.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'radiant-app/**'
      - '.github/workflows/radiant-app-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radiant-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: radiant-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Visual QA
        run: npm run visual:qa
